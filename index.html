<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEN KEY // THIÊN TRẦN</title><style>body{background:#050507;color:#cfcfcf;font-family:monospace;padding:20px;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.box{background:#0a0a0d;border:1px solid #ff2d55;padding:40px 32px;max-width:420px;width:100%;box-shadow:0 0 30px rgba(255,45,85,.3);text-align:center}.t1{color:#ff2d55;font-size:20px;font-weight:bold;letter-spacing:4px;margin-bottom:20px}h3{color:#888;font-size:12px;font-weight:normal;margin-bottom:10px}button{width:100%;padding:12px;background:#ff2d55;color:#000;border:1px solid #ff2d55;font-size:13px;font-weight:bold;cursor:pointer;margin-bottom:10px;text-transform:uppercase}button:hover{background:#ff4066}#keyOut{width:100%;padding:12px;background:#000;border:1px solid #222;color:#3f3;font-size:13px;text-align:center;margin-top:20px;outline:none;font-weight:bold}</style></head><body><div class="box"><div class="t1">GEN KEY</div><h3>chọn thời hạn</h3><button onclick="gen(1)">1 ngày</button><button onclick="gen(7)">7 ngày</button><button onclick="gen(30)">30 ngày</button><button onclick="gen(0)">Vĩnh viễn</button><input type="text" id="keyOut" placeholder="Key sinh ra..." readonly onclick="this.select()"></div><script>var SECRET='THIENTRAN_SECRET_2024_VEX';function h32(s){var h=0;for(var i=0;i<s.length;i++){h=Math.imul(31,h)+s.charCodeAt(i)|0;}var hex=(h>>>0).toString(16);while(hex.length<8)hex='0'+hex;return hex}function gen(days){var dHex=days.toString(16);if(dHex.length<2)dHex='0'+dHex;var rnd='';var chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';for(var i=0;i<16;i++)rnd+=chars.charAt(Math.floor(Math.random()*chars.length));var sig=h32(dHex+rnd+SECRET);var key='TT-'+dHex+'-'+rnd+'-'+sig;document.getElementById('keyOut').value=key}</script></body></html>
